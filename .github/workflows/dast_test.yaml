name: GitLab DAST Scan

on:
  workflow_dispatch:

jobs:
  dast:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/gitlab-org/security-products/dast:latest
    
    steps:
      - name: Run DAST Scan
        env:
          DAST_WEBSITE: "https://juice-shop.herokuapp.com"
          DAST_FULL_SCAN_ENABLED: "true"
        run: |
          mkdir -p /tmp/dast
          /analyze --target "$DAST_WEBSITE" --output /tmp/dast/gl-dast-report.json || true
          cp -r /tmp/dast $GITHUB_WORKSPACE/

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-dast-report
          path: dast/
