name: DAST Scan with GitLab

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  dast:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report folder
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dast-report"
          chmod 777 "${GITHUB_WORKSPACE}/dast-report"

      - name: Run GitLab DAST scan
        run: |
          docker run --rm \
            -e DAST_WEBSITE="https://juice-shop.herokuapp.com" \
            -e DAST_FULL_SCAN_ENABLED="true" \
            -e CI_PROJECT_DIR="/output" \
            -v "${GITHUB_WORKSPACE}/dast-report:/output" \
            registry.gitlab.com/gitlab-org/security-products/dast:latest \
            /analyze --target "https://juice-shop.herokuapp.com" --output /output/gl-dast-report.json || true

      - name: List generated files
        run: |
          echo "=== Contents of dast-report directory ==="
          ls -laR dast-report || echo "Directory not found or empty"
          echo "=== Checking for any JSON files ==="
          find dast-report -name "*.json" -type f || echo "No JSON files found"

      - name: Check if report exists
        id: check_report
        run: |
          if [ -f "dast-report/gl-dast-report.json" ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            echo "Report file found!"
            cat dast-report/gl-dast-report.json | head -20
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
            echo "Report file not found"
          fi

      - name: Upload DAST JSON report as artifact
        if: steps.check_report.outputs.report_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: dast-report/*.json

      - name: Upload all outputs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-output-debug
          path: dast-report/
